# pypiserver deployment on Linode VM
# ============================================================
# BEFORE RUNNING:
#   1. Point your domain's A record to your Linode IP
#   2. Copy this folder to the server: scp -r deploy/ user@your-server:~/pypi-deploy
#   3. Edit .env with your real domain and email
#   4. Run: ./scripts/init-certs.sh  (first time only)
#   5. Run: docker compose up -d
# ============================================================

services:

  # ── pypiserver ──────────────────────────────────────────────
  pypiserver:
    image: pypiserver/pypiserver:latest
    container_name: pypiserver
    restart: unless-stopped
    volumes:
      - ./data/packages:/data/packages       # package storage
      - ./data/auth/htpasswd.txt:/data/auth/htpasswd.txt:ro  # credentials
    command: >
      run
      --port 8080
      --passwords /data/auth/htpasswd.txt
      --authenticate download,update
      --server gunicorn
      --log-req-frmt "%(h)s %(l)s %(u)s %(t)s \"%(r)s\" %(s)s %(b)s"
      /data/packages
    networks:
      - pypi-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Nginx reverse proxy ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro             # ACME challenge
      - ./certbot/conf:/etc/letsencrypt:ro            # TLS certs
    depends_on:
      - pypiserver
    networks:
      - pypi-net

  # ── Certbot (cert renewal) ───────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "
    networks:
      - pypi-net

networks:
  pypi-net:
    driver: bridge
