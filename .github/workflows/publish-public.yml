# .github/workflows/publish-public.yml
# Manually publish pytest-api-core to public PyPI (https://pypi.org).
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   PYPI_API_TOKEN → Your PyPI API token (starts with pypi-...)
#
# Usage:
#   Go to Actions → Publish to Public PyPI → Run workflow
#   Enter version (e.g., 1.0.1) and choose whether to run tests

name: Publish to Public PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1)'
        required: true
        type: string
      run_tests:
        description: 'Run tests before publishing'
        required: false
        type: boolean
        default: true

jobs:
  # ── Run unit tests across Python versions ──────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: ${{ inputs.run_tests }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/test_unit.py -v --tb=short --no-header

      - name: Run integration tests
        run: pytest tests/test_sample_api.py -v --tb=short --no-header

  # ── Build & publish to public PyPI ─────────────────────────
  publish:
    name: Publish v${{ inputs.version }} to PyPI
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Update version in pyproject.toml
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting version to $VERSION"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          grep "^version" pyproject.toml

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Verify distribution
        run: |
          twine check dist/*
          ls -lh dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload \
            --non-interactive \
            --verbose \
            dist/*

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-v${{ inputs.version }}
          path: dist/
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          body: |
            ## pytest-api-core v${{ inputs.version }}
            
            Published to PyPI: https://pypi.org/project/pytest-api-core/${{ inputs.version }}/
            
            ### Installation
            ```bash
            pip install pytest-api-core==${{ inputs.version }}
            ```
            
            See [CHANGELOG](CHANGELOG.md) for details.
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
