# .github/workflows/publish.yml
# Publishes pytest-api-core to your private pypiserver on every version tag push (v*.*.*).
# Secrets required (set in GitHub repo → Settings → Secrets):
#   PYPI_SERVER_URL   e.g. https://pypi.yourdomain.com
#   PYPI_USERNAME
#   PYPI_PASSWORD

name: Build & Publish to Artifactory

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip integration tests"
        required: false
        default: "false"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/test_unit.py -v --tb=short

  publish:
    name: Publish to Artifactory
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build --sdist --wheel

      - name: Verify distribution
        run: twine check dist/*

      - name: Publish to private pypiserver
        env:
          PYPI_SERVER_URL: ${{ secrets.PYPI_SERVER_URL }}
          PYPI_USERNAME: ${{ secrets.PYPI_USERNAME }}
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m twine upload \
            --repository-url "$PYPI_SERVER_URL" \
            --username "$PYPI_USERNAME" \
            --password "$PYPI_PASSWORD" \
            --non-interactive \
            dist/*

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
