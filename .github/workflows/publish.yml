# .github/workflows/publish.yml
# Publishes pytest-api-core to https://pypi.subodhsingh.in on every version tag (v*.*.*).
#
# GitHub Secrets required (Settings → Secrets → Actions):
#   PYPI_SERVER_URL   → https://pypi.subodhsingh.in
#   PYPI_USERNAME     → pyuser
#   PYPI_PASSWORD     → your htpasswd password

name: Build & Publish to pypi.subodhsingh.in

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip unit tests before publishing"
        required: false
        default: "false"

jobs:
  # ── Run unit tests across Python versions ──────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/test_unit.py -v --tb=short --no-header

  # ── Build & publish ─────────────────────────────────────────
  publish:
    name: Publish to pypi.subodhsingh.in
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Build sdist + wheel
        run: python -m build --sdist --wheel

      - name: Verify distribution
        run: twine check dist/*

      - name: Upload to pypi.subodhsingh.in
        run: |
          twine upload \
            --repository-url "${{ secrets.PYPI_SERVER_URL }}" \
            --username "${{ secrets.PYPI_USERNAME }}" \
            --password "${{ secrets.PYPI_PASSWORD }}" \
            --non-interactive \
            --verbose \
            dist/*

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          retention-days: 30

          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          python -m twine upload \
            --repository-url "$PYPI_SERVER_URL" \
            --username "$PYPI_USERNAME" \
            --password "$PYPI_PASSWORD" \
            --non-interactive \
            dist/*

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
