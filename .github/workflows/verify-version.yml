# Guards against pyproject.toml drifting from the released version.
#
# Runs whenever a release tag (vX.Y.Z) is pushed and fails the build if the
# tag's version doesn't match the `version` field in pyproject.toml — the
# gap that let pyproject.toml stay at 1.0.0 through the v1.0.1/v1.0.2 releases.

name: Verify version matches tag

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    name: Check tag matches pyproject.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag version to pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')"

          echo "Tag version:       $TAG_VERSION"
          echo "pyproject.toml:    $PYPROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

          echo "Version check passed."
