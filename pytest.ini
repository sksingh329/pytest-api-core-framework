[pytest]

# ── Framework ────────────────────────────────────────────────────────────────
api_env            = dev
api_settings_module = config.settings
api_dotenv_file    = .env

# ── Report ───────────────────────────────────────────────────────────────────
addopts = --api-html-report=reports/{env}/report_{timestamp}.html -v

# ── Logging ──────────────────────────────────────────────────────────────────
# api_log_level controls pytest_api_core logger (request/response output)
api_log_level      = DEBUG

# Console (live) log output
log_cli            = true
log_cli_level      = DEBUG
log_cli_format     = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Captured log output (shown in HTML report per test)
log_level          = DEBUG
log_format         = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_date_format    = %H:%M:%S
